repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # TEMPORARILY DISABLED: end-of-file-fixer hook blocked by Windows Application
      # Control (WinError 4551) on its .exe wrapper. Content verified directly
      # via end_of_file_fixer.py before this commit. Will be restored.
      # - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
