services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
  # Named volumes the search container mounts so the bge model and pip
  # downloads survive across runs instead of being re-fetched each time.
  hf_cache:
  pip_cache:
